<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 网格交易总控台</title>
<style>
:root { color-scheme: dark; --bg:#0a0e17; --panel:#141924; --panel2:#0f1420; --border:#253350; --txt:#dde6f0; --mut:#8fa5c0; --pur:#8b5cf6; --red:#fca5a5; --yel:#fcd34d; }
* { box-sizing:border-box; }
body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
.login-card { width:min(100%,390px); padding:28px; background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 50px #0008; }
h1 { margin:0 0 7px; font-size:21px; }
.subtitle { margin:0 0 24px; color:var(--mut); font-size:12px; }
label { display:block; margin:13px 0 5px; color:var(--mut); font-size:12px; }
input { width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:7px; background:var(--panel2); color:var(--txt); font:inherit; }
input:focus { outline:none; border-color:var(--pur); }
input[readonly] { color:var(--mut); }
button { width:100%; margin-top:20px; padding:10px; border:0; border-radius:7px; background:linear-gradient(135deg,#7c3aed,var(--pur)); color:#fff; font:600 14px inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.5; }
.status { min-height:22px; margin:14px 0 0; color:var(--mut); font-size:12px; }
.status.error { color:var(--red); }
.status.warn { color:var(--yel); }
</style>
</head>
<body>
<main class="login-card">
  <h1>网格交易总控台</h1>
  <p class="subtitle">单账户访问 · 登录后才能查看和操作交易所</p>
  <form id="login-form">
    <label for="email">账户邮箱</label>
    <input id="email" name="email" type="email" value="jaychougo@gmail.com" readonly autocomplete="username" />
    <label for="password">登录密码</label>
    <input id="password" name="password" type="password" required minlength="12" autocomplete="current-password" autofocus />
    <button id="submit" type="submit">登录</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
const form = document.getElementById('login-form');
const email = document.getElementById('email');
const password = document.getElementById('password');
const submit = document.getElementById('submit');
const status = document.getElementById('status');

function show(message, type = '') {
  status.textContent = message;
  status.className = `status ${type}`.trim();
}

async function loadAuthStatus() {
  try {
    const response = await fetch('/api/auth/status', { cache: 'no-store', credentials: 'same-origin' });
    const data = await response.json();
    if (data.authenticated) { location.replace('/'); return; }
    if (data.accountEmail) email.value = data.accountEmail;
    if (!data.configured) {
      submit.disabled = true;
      show('管理员尚未配置密码哈希，请先在服务器运行 npm run auth:hash。', 'warn');
    } else if (data.requireHttps && location.protocol !== 'https:') {
      submit.disabled = true;
      show('当前部署要求使用 HTTPS，请通过 HTTPS 地址访问。', 'warn');
    }
  } catch {
    show('无法读取登录配置，请确认服务仍在运行。', 'error');
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  submit.disabled = true;
  show('登录中…');
  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email: email.value, password: password.value }),
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || `登录失败（HTTP ${response.status}）`);
    location.replace('/');
  } catch (error) {
    password.value = '';
    show(error.message || '登录失败，请稍后重试。', 'error');
    submit.disabled = false;
  }
});

loadAuthStatus();
</script>
</body>
</html>
